; 复制为 config.ini 再填你自己的值：cp config.ini.example config.ini
; config.ini 里有真实 key，已在 .gitignore，不要提交。

[server]
debug = True
secret_key = django-insecure-code-harmness-dev-only
allowed_hosts = localhost,127.0.0.1

[cors]
allowed_origins = http://localhost:5173,http://127.0.0.1:5173

[deepseek]
; 必填：https://platform.deepseek.com
api_key = XXXXX
; 可选：默认 deepseek-flash，可换 deepseek-v4-pro
model = deepseek-flash
; 可选：一般不用改
base_url = https://api.deepseek.com

[storage]
; 存储根目录：所有会话产生的文件都放在这里。相对路径按 backend/ 解析。目录结构：
;   <dir>/input/<会话id>/file/               用户上传的文件，以及模型用文件工具读写的文件
;   <dir>/input/<会话id>/skills/<文件名>.md   这个会话的插件：任何 .md 文件都可以，原样保存，文件名就是插件名
;   <dir>/input/<会话id>/skills/state.json   这个会话里哪些插件被勾选，形如 {"<文件名>.md": true}
;   <dir>/input/<会话id>/workflow/<文件名>.md   这个会话的工作流：任何 .md 文件都可以，原样保存，文件名就是工作流名
;   <dir>/input/<会话id>/workflow/state.json   这个会话里哪些工作流被勾选，形如 {"<文件名>.md": true}
; 目录都是第一次用到时才创建；整个存储根目录已在 .gitignore，不会进仓库。
dir = storage
; 默认插件目录：里面的 .md 文件是「默认插件」，所有会话都能看到、不能删除（删除返回 403）。
;   - 只读：不会被复制进会话目录，也不会被改动；往目录里放 / 拿走 .md 文件，刷新页面就生效，不用重启。
;   - 是否勾选仍然各会话各自记在自己的 state.json 里，互不影响。
;   - 会话里上传同名文件会被拒绝（409），默认插件始终只有一份。
;   - 相对路径按 backend/ 解析；留空表示没有默认插件；目录不存在也不报错，只是没有默认插件。
default_skills_dir = default_skills
; 默认工作流目录：规则和默认插件完全一样（所有会话可见、只读、不能删除、同名上传返回 409）。
;   工作流本身现阶段还没有实现：这里只管存放、勾选和删除。留空表示没有默认工作流。
default_workflow_dir = default_workflow
; 单个上传文件的大小上限，单位 MB；普通上传和插件上传共用这一个上限
max_upload_mb = 20

[eureka]
; eureka 时刻：当前会话用了某个插件，并且工作流里有 name 相同的文件，而且模型这一轮的回复通过了那个工作流的 schema 校验，
; 就在这条回复下面多显示一条提示，文本就是下面这一行。
;   - 只是提示：它不会进模型的上下文（保存在单独的数据库表里，刷新页面后仍然在）。
;   - 以后会在这里接入新的实现；现在只负责判定、保存和展示。
;   - 一行文本，支持 emoji；留空则使用内置的默认文本。改完重启后端生效，已经出现过的提示保持当时的文字不变。
text = 🎉✨ Eureka 时刻！🚀 这一步已通过工作流校验，成果就绪，点击查看触发详情 💡
;
; --- eureka 之后展开的工作流（插件机制，见 AGENTS.md「eureka 插件机制」）---
; 要展开工作流的插件，对应 backend/eureka/plugins/<目录名>/，逗号分隔；留空表示不展开任何工作流（只显示上面的提示）。
; 目录名是 Python 包名（小写字母、下划线）；插件的 name（如 code-review）要和工作流 frontmatter 的 name 一致。
plugins = code_review, analyze_config, deploy_game
; 单个阶段的超时，单位秒。超时只是标记失败并放弃等待（Python 不能安全地杀线程）。
stage_timeout_seconds = 90
; 插件通过 webhook 把「打印文字」发回主项目用的地址（必须能访问到本后端；接收接口只允许本机来源）。
webhook_base_url = http://127.0.0.1:8000
;
; --- eureka 插件里调用 LangChain 用的 DeepSeek 配置（code_review 的「生成修改」阶段）---
; 这是 [deepseek] 那一组配置的一份拷贝，独立于聊天用的配置：改这里只影响 eureka 插件，不影响聊天。
; 留空的项会回退到 [deepseek] 里同名的值，所以也可以只填需要不同的那几项（比如换个模型）。
llm_api_key = XXXXX
llm_model = deepseek-flash
llm_base_url = https://api.deepseek.com
; 推理强度：none / low / high / max（none 关闭思考；改写代码一般用 low 就够）
llm_reasoning_effort = low
; 单次调用的超时（秒）。要比 stage_timeout_seconds 小，否则阶段先超时、模型调用还在跑
llm_timeout_seconds = 50

; --- deploy_game 插件（前端小游戏部署）---
; 拷贝目录：会话工作区的文件会被拷到 <deploy_dir>/port-<端口>/，并在那里用 npx 启动。相对路径按 backend/ 解析（已在 .gitignore 之外请自行确认）。
deploy_dir = deployed
; 对外访问的 ip / 域名：返回给用户的地址是 http://<deploy_host>:<端口>。部署到服务器时改成服务器的 ip 或域名。
deploy_host = 127.0.0.1
; 启动后等端口通的最长时间（秒）；要小于 stage_timeout_seconds
deploy_start_timeout_seconds = 30
